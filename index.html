<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aedas · Trend References</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same format as the Aedas Marketing Timeline: style rows down the side, months across the top. */
  :root{--up1:#BBF7D0;--up2:#22C55E;--ink:#111;--mute:#6B6B6B;--line:#EDEDED;--line2:#D4D4D4;--bg:#fff;--hover:#F4F4F4;--top:#FACC15;--pick:#22C55E;--none:#D4D4D4;--cw:104px;--lc:34px}
  *{box-sizing:border-box;margin:0;padding:0;min-width:0}
  html,body{height:100%}
  body{font-family:'Inter Tight',Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  button:focus-visible,input:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  a{color:inherit}

  /* timeline */
  .tl{position:fixed;inset:44px 0 0;overflow:auto;background:#fff;padding-bottom:70px}
  .hdr{position:sticky;top:0;z-index:12;display:flex;height:30px;background:#111;color:#fff;width:max-content;min-width:100%}
  .hdr .corner{position:sticky;left:0;z-index:13;width:var(--lc);flex:none;background:#111;display:grid;place-items:center;font-size:12px;font-weight:700}
  .hdr .m{flex:none;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;border-left:1px solid #2A2A2A;white-space:nowrap}
  .hdr .m b{font-weight:800;margin-right:5px}
  .hdr .m.now{background:#2A2A2A}
  .row{position:relative;display:flex;width:max-content;min-width:100%;border-bottom:1px solid var(--line)}
  .rl{position:sticky;left:0;z-index:8;width:var(--lc);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .rl span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;white-space:nowrap}
  .wm{position:sticky;left:calc(var(--lc) + 14px);width:0;flex:none;z-index:0;pointer-events:none}
  .wm span{position:absolute;top:22px;left:0;font-size:30px;font-weight:800;letter-spacing:.02em;color:#F1F1F1;white-space:nowrap}
  .cell{flex:none;display:flex;gap:8px;padding:14px 8px 14px;border-left:1px solid var(--line);position:relative;z-index:1;align-items:flex-start}
  .cell.now{background:#FAFAFA}

  .rc{width:var(--cw);flex:none;display:flex;flex-direction:column;gap:3px}
  .rc.post{width:calc(var(--cw) * 64 / 45)}
  .rc.wide{width:calc(var(--cw) * 256 / 81)}
  .th.wide{aspect-ratio:16/9}
  .frame.ytf{aspect-ratio:16/9}
  .frame iframe.yt{width:100%;height:100%}
  .mid .frame.ytf{width:min(calc(min(100vh - 130px, 820px) * 16 / 9), calc(100vw - 560px))}
  .th .hit{cursor:pointer}.th .hit.side{left:44px;right:44px}
  .rm{display:flex;flex-direction:column;gap:1px;cursor:pointer;min-width:0}
  .rm:hover .rt{text-decoration:underline}
  .exp{position:absolute;z-index:4;top:5px;left:5px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;opacity:0;transition:opacity .15s}
  .exp svg{width:12px;height:12px;fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .rc:hover .exp,.exp:focus-visible{opacity:1}
  .th{position:relative;width:100%;aspect-ratio:9/16;background:#111;overflow:hidden;border-bottom:3px solid var(--none)}
  .th.post{aspect-ratio:4/5}
  .rc.v1 .th{border-bottom-color:var(--up1)}
  .rc.v2 .th{border-bottom-color:var(--up2)}
  .th .frame{position:absolute;inset:0;width:100%;height:100%}
  .th .hit{position:absolute;inset:0;z-index:3}
  
  .badge{position:absolute;z-index:4;top:4px;right:4px;font-size:9px;font-weight:700;background:#fff;color:#111;border-radius:999px;padding:1px 6px}
  .rt{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .rd{font-size:10px;color:var(--mute);white-space:nowrap}

  /* media */
  .frame{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;background:#111}
  .frame.igf{aspect-ratio:4/5}
  .frame iframe{position:absolute;top:0;left:0;border:0}
  .frame iframe.tt{width:100%;height:100%}
  .frame iframe.ig{width:326px;height:900px;transform-origin:0 0}

  /* top-right controls (like the timeline) */
  .ctl{position:fixed;top:0;left:0;right:0;z-index:20;height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);color:#111}
  .ctl .brand{margin-right:auto;font-size:13px}
  .brand{font-size:12px;font-weight:600;white-space:nowrap;margin-right:4px}
  .pills{display:flex;gap:2px;padding:2px;border:1px solid #D4D4D4;border-radius:999px;background:#fff}
  .pills button{font-size:12px;font-weight:600;height:22px;line-height:22px;padding:0 10px;border-radius:999px;color:#111;white-space:nowrap}
  .pills button.on{background:#111;color:#fff}
  .srch{height:24px;width:180px;border-radius:999px;border:1px solid #D4D4D4;background:#fff;color:#111;font-size:11px;padding:0 10px}
  .srch::placeholder{color:#6B6B6B}

  /* bottom floating bar */
  .bbar{position:fixed;right:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);border-radius:999px;padding:4px 6px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:0 6px}
  .lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .bb{height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .bb:hover{background:var(--hover)}
  .bb.on{background:#111;color:#fff}
  .bb.ic{width:26px;padding:0;justify-content:center;font-size:16px}
  .vsep{width:1px;height:18px;background:var(--line2);margin:0 2px}

  /* list view */
  .lv{position:fixed;inset:44px 0 0;overflow:auto;background:#fff;display:none;padding:28px 40px 90px}
  .lv.open{display:block}
  .lv table{width:100%;border-collapse:collapse}
  .lv th{position:sticky;top:-28px;background:#fff;text-align:left;font-size:12px;font-weight:600;padding:10px;border-bottom:2px solid #111}
  .lv td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  .lv tr.r{cursor:pointer}.lv tr.r:hover td{background:var(--hover)}
  .dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px;background:var(--none)}

  /* post-details panel */
  .pp{position:fixed;inset:0;z-index:40;background:#fff;display:none;flex-direction:column}
  .pp.open{display:flex}
  .pph{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.1em;color:#555}
  .crumb i{width:12px;height:12px;border:2px solid var(--none);display:inline-block}
  .ppa{display:flex;align-items:center;gap:8px}
  .tb{border:1px solid var(--line2);background:#fff;border-radius:999px;height:28px;padding:0 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
  .tb:hover{background:var(--hover)}
  .tb.dark,.tb.on{background:#111;color:#fff;border-color:#111}
  .x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px}
  .x:hover{background:var(--hover)}
  .ppg{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px}
  .mid{background:#F4F4F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;position:relative;min-height:0}
  .mt{align-self:center;font-size:16px;font-weight:700}
  .mid .stage{display:flex;align-items:center;gap:24px}
  .mid .frame{width:calc(min(100vh - 130px,820px) * 9 / 16);flex:none;border:4px solid var(--none)}
  .mid .frame.igf{width:calc(min(100vh - 130px,820px) * 4 / 5)}
  .mid .frame.v1{border-color:var(--up1)}.mid .frame.v2{border-color:var(--up2)}
  .nav{width:34px;height:34px;border-radius:50%;border:1px solid #111;background:#fff;display:grid;place-items:center;font-size:15px;flex:none}
  .nav:hover{background:var(--hover)}
  .ds{overflow:auto;padding:22px 22px 60px;border-left:1px solid var(--line)}
  .ds h2{font-size:22px;font-weight:700;letter-spacing:-.01em;padding-bottom:10px;border-bottom:1px solid #111;margin-bottom:16px}
  .ft{width:100%;border-collapse:collapse}
  .ft td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
  .ft td:first-child{width:118px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mute);padding-top:10px}
  .ft ol{padding-left:18px}
  .sd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--none)}
  .dacts{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px}
  .sec2{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mute);margin:18px 0 4px}
  .toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:60;background:#111;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;font-size:12px;font-weight:600;display:none;align-items:center;gap:10px}
  .toast.show{display:flex}.toast button{background:#fff;color:#111;border-radius:999px;height:24px;padding:0 12px;font-size:12px;font-weight:700}
  .tb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tb.ic{width:34px;padding:0;justify-content:center}.tb.ic2{width:44px;padding:0;justify-content:center;gap:0}.tb.ic2 svg+svg{margin-left:-6px}
  .tb.v1on{background:#DCFCE7;border-color:#86EFAC;color:#166534}
  .tb.v2on{background:var(--up2);border-color:var(--up2);color:#fff}
  .lg svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dpop{position:fixed;top:40px;right:14px;z-index:30;width:340px;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:8px;display:none}
  .dpop.open{display:block}
  .dpop .di{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px}
  .dpop .di:hover{background:var(--hover)}
  .dpop .di b{flex:1;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dpop .di span{font-size:11px;color:var(--mute);white-space:nowrap}
  .dpop .di button{height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);font-size:11px;font-weight:600}
  .dpop .di button:hover{background:#111;color:#fff;border-color:#111}
  .dpop .empty{padding:10px;font-size:12px;color:var(--mute)}
  .dbtn{height:24px;padding:0 12px;border-radius:999px;border:1px solid #D4D4D4;font-size:12px;font-weight:600;white-space:nowrap}
  .dbtn:hover,.dbtn.on{background:#111;color:#fff;border-color:#111}
  .row{padding-top:0}.row:first-child{border-top:0}
  .addt{flex:none;width:var(--cw);aspect-ratio:9/16;background:#F4F4F4;display:grid;place-items:center;color:#6B6B6B;font-size:26px;font-weight:300}
  .addt:hover{background:#111;color:#fff}
  .rl{cursor:pointer}.rl:hover{background:var(--hover)}
  .row.addrow .rl{padding:10px 0}.row.addrow .cell{padding:0}
  .addrl{width:24px;height:24px;border-radius:50%;border:1px solid #111;display:grid;place-items:center;font-size:15px;line-height:1;background:#fff}
  .addrl:hover{background:#111;color:#fff}
  .md{position:fixed;inset:0;z-index:70;background:rgba(17,17,17,.35);display:none;align-items:center;justify-content:center;padding:20px}
  .md.open{display:flex}
  .mc{background:#fff;width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:14px;padding:22px}
  .mc h3{font-size:18px;font-weight:700;margin-bottom:14px}
  .fl{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .fl>span{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
  .fl input,.fl textarea,.fl select{border:1px solid #D4D4D4;border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;width:100%}
  .fl textarea{min-height:110px;resize:vertical;line-height:1.4}
  .fl input:focus,.fl textarea:focus{outline:1px solid #111;border-color:#111}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .err{color:#B91C1C;font-size:12px;font-weight:600;min-height:16px}
  .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
  .mf .left{margin-right:auto}
  .raw{white-space:pre-wrap;font-size:13px;line-height:1.5;padding:8px 0}
  .fx{position:fixed;inset:44px 0 0;z-index:25;background:#fff;display:none;flex-direction:column;--cw:calc((100vh - 250px) * 9 / 16)}
  .fx.open{display:flex}
  .fxh{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
  .fxh b{font-size:16px;font-weight:700;margin-right:auto}
  .fxb{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;gap:14px;padding:0 24px 60px}
  .fxb .rc{gap:5px}.fxb .rt{font-size:13px}.fxb .rd{font-size:11px}
  .fxb .addt{font-size:40px}
  @media (max-width:900px){.ppg{grid-template-columns:1fr;overflow:auto}.ds{border-left:0}.mid .frame{width:min(100%,340px)}.srch{width:100px}.brand{display:none}}
</style>
</head>
<body>
<div class="tl" id="tl"></div>
<div class="ctl">
  <span class="brand">Aedas · Trend References</span>
  <input class="srch" id="q" type="search" placeholder="Search" aria-label="Search references">
  <div class="pills" id="pType"></div>
  <div class="pills" id="pPlat"></div>

</div>

 {id:"t1",c:"team",v0:2,t:"Video",ig:"p/DTu-UVoERDT",d:"Jan 2026",n:"Iftar (cinematic)",s:"",w:"Cinematic event film: slow camera moves, warm low light and close details of the table and the people.",why:"Feels premium and emotional, not salesy. Seasonal moments like Ramadan and Iftar get strong engagement, and the slow cinematic pace makes an office event look special."},

 {id:"t3",c:"team",v0:2,t:"Post",ig:"p/DZVu22Bjdnr",d:"Jun 2026",n:"20 years restyle",s:"",w:"An anniversary piece that restyles past work in today's look.",why:"Milestones are a strong story. Mixing old and new shows heritage and growth at once, a model for an Aedas anniversary piece."},
 {id:"t4",c:"team",v0:2,t:"Video",yt:"EA26cTAYQOo",d:"Apr 2023",n:"20 years: NYT “Gravity”",s:"",w:"The New York Times “More of Life Brought to Life: Gravity” (Droga5, 2023): one story flows into the next through a chain of linked objects.",why:"One idea leading to the next keeps people watching and shows range in one flowing piece. A 20-years film could chain project to project the same way."},
 {id:"t5",c:"team",v0:2,t:"Video",ig:"p/DXQXS86CQZX",d:"Apr 2026",n:"Postcard video (Rixos)",s:"",w:"A place shown as a series of postcard-style frames that come to life.",why:"Every shot is composed like a postcard, so the place looks its best and the film feels premium. Fits showing a finished building or project."},

 {id:"t9",c:"team",v0:2,t:"Video",ig:"p/DRheQkjFAmf",d:"Nov 2025",n:"Interview (Bvlgari)",s:"",w:"A premium, well-lit interview with a strong personality, cut with close details.",why:"A real person's voice and personality at the centre, with a luxury feel. A model for interviews with Aedas leaders and designers."},
 {id:"e1",c:"edit",t:"Video",ig:"p/DdoRaagRBl2",d:"Oct 2026",n:"Small text zoom",s:"Drop It Like It's Hot x Staying Alive",w:"Tiny text on screen zooms in to reveal the message.",hook:"Text too small to read yet, so people stop to look.",len:"7–10 s",ax:"A wide studio or building shot with one small line of text placed on it.",sh:["Locked-off shot of the scene, 2–3 s","Small text in one corner (about 10% size)","Punch-in zoom to the text on the beat drop","Hold the full-screen message 2 s"],ed:"Keyframe zoom on the beat. One font, high contrast.",kit:"Phone on tripod"},

 {id:"e4",c:"edit",t:"Video",ig:"reel/DWuaKdtiR4a",d:"Jun 2026",n:"Stomp to reveal",s:"Original audio",w:"Each stomp peels back the background until the scene has completely changed.",hook:"First stomp within 1 s.",len:"8–10 s",ax:"One person in the same spot across 3–4 Aedas places: studio, model shop, site, finished project.",sh:["Full-body shot, fixed camera","Stomp on each beat (3–4 stomps)","Background changes behind the person after each stomp"],ed:"Hard cut on each stomp, same body position every take.",kit:"Tripod, floor marks"},

let fk=null;
function openFocus(k){fk=k;stopPlayers();const fx=document.getElementById("fx"),l=rowList(k);
  fx.innerHTML='<div class="fxh"><b>'+esc(CATS[k])+'</b><button class="tb" data-row="'+k+'">Edit row</button><button class="x" data-unfocus aria-label="Close row">✕</button></div><div class="fxb">'+l.map(rc).join("")+'<button class="addt" data-add="'+k+'" aria-label="Add to '+esc(CATS[k])+'">+</button></div>';
  fx.classList.add("open");fitAll()}
function closeFocus(){fk=null;const fx=document.getElementById("fx");fx.classList.remove("open");fx.innerHTML=""}
function closeRef(){stopPlayers();cur=null;const p=document.getElementById("pp");p.classList.remove("open");p.innerHTML=""}
function step(d){if(!cur)return;const L=rowList(byId(cur).c);if(!L.length)return;const i=L.findIndex(x=>x.id===cur);openRef(L[((i<0?0:i)+d+L.length)%L.length].id)}
const cardsOf=id=>[...document.querySelectorAll('.rm[data-open="'+id+'"]')].filter(m=>!m.closest("#pp")).map(m=>m.closest(".rc"));
const cardOf=id=>({classList:{remove:(...a)=>cardsOf(id).forEach(c=>c.classList.remove(...a)),add:(...a)=>cardsOf(id).forEach(c=>c.classList.add(...a))},remove:()=>cardsOf(id).forEach(c=>c.remove())});
function soft(){renderCtl();renderDump()}
function vote(n){if(!cur)return;const id=cur;S.v[id]=vOf(id)===n?0:n;if(!S.v[id])delete S.v[id];save();
  const c=cardOf(id);if(c){c.classList.remove("v1","v2");if(vOf(id))c.classList.add("v"+vOf(id))}
  const f=document.querySelector("#pp .mid .frame");if(f){f.classList.remove("v1","v2");if(vOf(id))f.classList.add("v"+vOf(id))}
  document.querySelectorAll("#pp [data-vote]").forEach(b=>{const k=+b.dataset.vote;b.classList.toggle(k===1?"v1on":"v2on",vOf(id)===k)});
  soft();pushVerdict(id)}
const MD=document.getElementById("md"),MC=document.getElementById("mc");
function closeMd(){MD.classList.remove("open");MC.innerHTML=""}
function parseLink(u){u=(u||"").trim();let y=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);if(y)return Object.assign({yt:y[1],url:"https://www.youtube.com/watch?v="+y[1]},/shorts\//.test(u)?{ys:1}:{});let m=u.match(/instagram\.com\/(?:[^\/]+\/)?(p|reel|reels|tv)\/([A-Za-z0-9_-]+)/);if(m){const k=m[1]==="p"?"p":"reel";return{ig:k+"/"+m[2],url:"https://www.instagram.com/"+k+"/"+m[2]+"/"}}
  m=u.match(/tiktok\.com\/@([^\/?#]+)\/(?:video|photo)\/(\d+)/);if(m)return{tt:m[2],h:m[1],url:"https://www.tiktok.com/@"+m[1]+"/video/"+m[2]};return null}
const toMonth=d=>{if(!d)return"";const[m,y]=d.split(" ");const i=MONS.indexOf(m);return i<0?"":y+"-"+String(i+1).padStart(2,"0")};
const fromMonth=v=>{const[y,m]=(v||"").split("-");return y&&m?MONS[+m-1]+" "+y:""};
function openAdd(k,id){const t=id?byId(id):null;const now=new Date();
  MC.innerHTML='<h3>'+(t?"Edit reference":"Add to "+esc(CATS[k]))+'</h3>'+
   '<label class="fl"><span>LINK</span><input id="fLink" placeholder="Instagram or TikTok link" value="'+(t?esc(t.url||watchUrl(t)):"")+'"></label>'+
   '<label class="fl"><span>NAME</span><input id="fName" value="'+(t?esc(t.n):"")+'"></label>'+
   '<div class="two"><label class="fl"><span>DATE</span><input id="fDate" type="month" value="'+(t?toMonth(t.d):now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0"))+'"></label>'+
   '<label class="fl"><span>TYPE</span><select id="fType"><option'+(t&&t.t==="Post"?"":" selected")+'>Video</option><option'+(t&&t.t==="Post"?" selected":"")+'>Post</option></select></label></div>'+
   '<label class="fl"><span>ROW</span><select id="fRow">'+S.rows.map(r=>'<option value="'+r.k+'"'+((t?t.c:k)===r.k?" selected":"")+'>'+esc(r.n)+'</option>').join("")+'</select></label>'+
   '<label class="fl"><span>SOUND</span><input id="fSound" value="'+(t?esc(t.s||""):"")+'"></label>'+
   '<label class="fl"><span>THE STYLE</span><input id="fStyle" value="'+(t?esc(t.w||""):"")+'"></label>'+
   '<label class="fl"><span>SHOT LIST</span><textarea id="fShots">'+(t?esc(t.raw||""):"")+'</textarea></label>'+
   '<div class="err" id="fErr"></div>'+
   '<div class="mf">'+(t?'<button class="tb left" data-del="'+t.id+'">Delete</button>':'')+'<button class="tb" data-mdclose>Cancel</button><button class="tb dark" data-saveadd="'+(t?t.id:"")+'">Save</button></div>';
  MD.classList.add("open");setTimeout(()=>document.getElementById(t?"fName":"fLink").focus(),0)}
function saveAdd(id){const L=parseLink(document.getElementById("fLink").value),err=document.getElementById("fErr");
  if(!L){err.textContent="Paste a full Instagram post/reel or TikTok video link.";return}
  const n=document.getElementById("fName").value.trim();if(!n){err.textContent="Give it a name.";return}
  const d=fromMonth(document.getElementById("fDate").value)||MONS[new Date().getMonth()]+" "+new Date().getFullYear();
  const o=Object.assign({c:document.getElementById("fRow").value,t:document.getElementById("fType").value,d,n,s:document.getElementById("fSound").value.trim(),w:document.getElementById("fStyle").value.trim(),raw:document.getElementById("fShots").value.trim(),custom:1},L);
  if(id){const t=byId(id);["ig","tt","h","yt","ys"].forEach(x=>delete t[x]);Object.assign(t,o);const a=S.added.find(x=>x.id===id);if(a&&a!==t){["ig","tt","h","yt","ys"].forEach(x=>delete a[x]);Object.assign(a,o)}}
  else{o.id="u"+Date.now().toString(36);T.push(o);S.added.push(o)}
  save();closeMd();render();if(id&&cur===id)openRef(id);toast(id?"Saved":"Added “"+n+"”",false);pushRef(byId(id||o.id))}
function delAdded(id){S.added=S.added.filter(x=>x.id!==id);const i=T.findIndex(x=>x.id===id);if(i>=0)T.splice(i,1);delete S.v[id];S.dumped=S.dumped.filter(x=>x!==id);save();closeMd();if(cur===id)closeRef();render();pushDelRef(id)}
function openRow(k){const r=k?S.rows.find(x=>x.k===k):null;const used=k&&T.some(t=>t.c===k);
  MC.innerHTML='<h3>'+(r?"Edit row":"New row")+'</h3><label class="fl"><span>NAME</span><input id="rName" value="'+(r?esc(r.n):"")+'"></label><div class="err" id="rErr"></div>'+
   '<div class="mf">'+(r&&!used?'<button class="tb left" data-rowdel="'+k+'">Delete row</button>':'')+'<button class="tb" data-mdclose>Cancel</button><button class="tb dark" data-rowsave="'+(k||"")+'">Save</button></div>';
  MD.classList.add("open");setTimeout(()=>document.getElementById("rName").focus(),0)}
function saveRow(k){const n=document.getElementById("rName").value.trim();if(!n){document.getElementById("rErr").textContent="Give the row a name.";return}
  if(k){S.rows.find(x=>x.k===k).n=n}else S.rows.push({k:"r"+Date.now().toString(36),n});syncCats();save();closeMd();render();pushRows()}

/* ---------- Shared online data (Supabase). Empty settings = this browser only. ---------- */
const SB={url:"https://nyxqymsubxhvcmpmqksb.supabase.co",key:"sb_publishable_J-JCvWHuZUpc1faG06n72w_5lFz_Gv4"};
const LIVE=!!(SB.url&&SB.key),PK="aedasTrendRefs.pass";
function sbHeaders(){const h={"apikey":SB.key,"Content-Type":"application/json"};if(!/^sb_publishable_/.test(SB.key))h.Authorization="Bearer "+SB.key;return h}
async function sbGet(path){const r=await fetch(SB.url.replace(/\/$/,"")+"/rest/v1/"+path,{headers:sbHeaders(),cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function sbRpc(fn,args){return fetch(SB.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:sbHeaders(),body:JSON.stringify(args)})}
let passWait=null;
function askPass(){return new Promise(res=>{passWait=res;
  MC.innerHTML='<h3>Team passcode</h3><label class="fl"><span>PASSCODE</span><input id="pPass" type="password" autocomplete="off"></label><div class="err" id="pErr"></div><div class="mf"><button class="tb" data-passno>Cancel</button><button class="tb dark" data-passok>Save</button></div>';
  MD.classList.add("open");setTimeout(()=>document.getElementById("pPass").focus(),0)})}
function passDone(v){const r=passWait;passWait=null;closeMd();if(r)r(v)}
async function getPass(){let p="";try{p=localStorage.getItem(PK)||""}catch(e){}if(p)return p;p=await askPass();if(p){try{localStorage.setItem(PK,p)}catch(e){}}return p}
let pushing=0;
async function push(fn,args){if(!LIVE)return;pushing++;try{const p=await getPass();if(!p){await sync(true);return}
  const r=await sbRpc(fn,Object.assign({p_pass:p},args));
  if(!r.ok){const t=await r.text();if(/passcode/i.test(t)){try{localStorage.removeItem(PK)}catch(e){}toast("Wrong passcode",false)}else toast("Couldn't save. Check your connection.",false);await sync(true)}}
  catch(e){toast("Couldn't save. Check your connection.",false);await sync(true)}finally{pushing--}}
const pushVerdict=id=>push("save_verdict",{p_id:id,p_v:vOf(id),p_dumped:S.dumped.includes(id)});
const pushRef=t=>{const d=Object.assign({},t);return push("save_ref",{p_id:t.id,p_data:d})};
const pushDelRef=id=>push("delete_ref",{p_id:id});
const pushRows=()=>push("save_rows",{p_rows:S.rows.map((r,i)=>({k:r.k,n:r.n,ord:i}))});
let lastSig="";
const sig=()=>JSON.stringify([S.rows,S.added,S.dumped.slice().sort()]);
async function sync(force){if(!LIVE||(pushing&&!force))return;
  try{const[rows,refs,ver]=await Promise.all([sbGet("rows?select=k,n,ord&order=ord"),sbGet("refs?select=id,data&order=created_at"),sbGet("verdicts?select=id,v,dumped")]);
    if(rows.length)S.rows=rows.map(r=>({k:r.k,n:r.n}));ensureRows();
    for(let i=T.length-1;i>=0;i--)if(T[i].custom)T.splice(i,1);
    S.added=refs.map(r=>Object.assign({},r.data,{id:r.id,custom:1}));S.added.forEach(t=>T.push(t));
    S.v={};S.dumped=[];ver.forEach(x=>{if(x.v)S.v[x.id]=x.v;if(x.dumped)S.dumped.push(x.id)});T.forEach(t=>{if(t.v0&&!ver.some(x=>x.id===t.id))S.v[t.id]=t.v0});
    syncCats();save();const s=sig();
    if(s!==lastSig){lastSig=s;render()}else{document.querySelectorAll(".rc").forEach(c=>{const m=c.querySelector(".rm");if(!m)return;const n=vOf(m.dataset.open);c.classList.remove("v1","v2");if(n)c.classList.add("v"+n)});renderCtl()}
    if(cur&&byId(cur)&&!S.dumped.includes(cur)){const n=vOf(cur);document.querySelectorAll("#pp [data-vote]").forEach(b=>{const k=+b.dataset.vote;b.classList.toggle(k===1?"v1on":"v2on",n===k)});const f=document.querySelector("#pp .mid .frame");if(f){f.classList.remove("v1","v2");if(n)f.classList.add("v"+n)}}
  }catch(e){}}
if(LIVE){setInterval(()=>{if(!document.hidden&&!MD.classList.contains("open"))sync()},20000);addEventListener("focus",()=>sync())}

let lastDump=null,tt=0;
function toast(m,undo){document.getElementById("toastMsg").textContent=m;document.getElementById("undo").style.display=undo?"":"none";document.getElementById("toast").classList.add("show");clearTimeout(tt);tt=setTimeout(hideToast,5000)}
function hideToast(){document.getElementById("toast").classList.remove("show")}
function dump(id){const t=byId(id),L=rowList(t.c),i=L.findIndex(x=>x.id===id),nx=L.length>1?L[(i+1)%L.length].id:null;delete S.v[id];S.dumped=[...S.dumped.filter(x=>x!==id),id];lastDump=id;save();const c=cardOf(id);if(c)c.remove();soft();if(nx)openRef(nx);else closeRef();toast("Dumped “"+t.n+"”",true);pushVerdict(id)}
function restore(id){S.dumped=S.dumped.filter(x=>x!==id);save();render();pushVerdict(id)}
const askText=t=>"Reelo, write the 8-part shot list for this trend and add it to the catalogue in REELO.md:\n"+t.n+" — "+plat(t)+" · "+t.t+" · "+t.d+" · style group: "+CATS[t.c]+(t.s?"\nSound: "+t.s:"")+(t.w?"\nThe style: "+t.w:"")+(t.why?"\nWhy it works: "+t.why:"")+"\nLink: "+watchUrl(t);
const shotText=t=>!t.sh?(t.raw?t.n+" — "+plat(t)+", "+t.d+"\n\n"+t.raw+"\n\nReference: "+watchUrl(t):askText(t)):t.n+" — "+plat(t)+", "+t.d+"\n\n1. The style: "+t.w+"\n2. Hook (first 2 s): "+t.hook+"\n3. Shots:\n"+t.sh.map((x,i)=>"   "+(i+1)+") "+x).join("\n")+"\n4. Edit & text: "+t.ed+"\n5. Sound: "+t.s+"\n6. Length: "+t.len+"\n7. What to capture at Aedas: "+t.ax+"\n8. Kit: "+t.kit+"\n\nReference: "+watchUrl(t);
function copy(s){const fb=x=>{const a=document.createElement("textarea");a.value=x;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()};
  try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).catch(()=>fb(s));else fb(s)}catch(e){fb(s)}}
function feedback(){const ln=t=>"- "+t.n+" ("+CATS[t.c]+", "+plat(t)+", "+t.d+") "+watchUrl(t);const of=n=>Object.keys(S.v).filter(id=>S.v[id]===n&&!S.dumped.includes(id)).map(byId).filter(Boolean).map(ln).join("\n")||"- none";
  return "Reelo, feedback from the Trend References board:\n\nLoved (find more like these):\n"+of(2)+"\n\nLiked:\n"+of(1)+"\n\nDumped (don't suggest similar):\n"+(S.dumped.map(byId).filter(Boolean).map(ln).join("\n")||"- none")+"\n\nAdded by the team (add to the catalogue; write shot lists where missing):\n"+(S.added.filter(t=>!S.dumped.includes(t.id)).map(ln).join("\n")||"- none")+"\n\nStyle rows on the board: "+S.rows.map(r=>r.n).join(" · ")+"\n\nAdd all of this to your memory."}

document.addEventListener("click",e=>{
  if(e.target.closest("a"))return;
  const pop=document.getElementById("dpop");
  if(e.target.closest("#dumpBtn")){pop.classList.toggle("open");document.getElementById("dumpBtn").classList.toggle("on",pop.classList.contains("open"));return}
  const rs=e.target.closest("[data-restore]");if(rs){restore(rs.dataset.restore);return}
  if(!e.target.closest("#dpop")&&pop.classList.contains("open")){pop.classList.remove("open");document.getElementById("dumpBtn").classList.remove("on")}
  const vt=e.target.closest("[data-vote]");if(vt){vote(+vt.dataset.vote);return}
  const dp=e.target.closest("[data-dump]");if(dp){dump(dp.dataset.dump);return}
  if(e.target.closest("#undo")){if(lastDump){restore(lastDump);if(!cur)openRef(lastDump);else openRef(lastDump);lastDump=null}hideToast();return}
  if(e.target.closest("#copyFb")){copy(feedback());toast("Copied for Reelo",false);return}
  const f=e.target.closest("[data-f]");if(f){F[f.dataset.f]=f.dataset.v;render();return}
  if(e.target.closest("[data-passok]")){passDone(document.getElementById("pPass").value.trim());return}
  if(e.target.closest("[data-passno]")||(passWait&&e.target===MD)){passDone("");return}
  if(e.target===MD||e.target.closest("[data-mdclose]")){closeMd();return}
  const sa=e.target.closest("[data-saveadd]");if(sa){saveAdd(sa.dataset.saveadd);return}
  const de=e.target.closest("[data-del]");if(de){delAdded(de.dataset.del);return}
  const rsv=e.target.closest("[data-rowsave]");if(rsv){saveRow(rsv.dataset.rowsave);return}
  const rdl=e.target.closest("[data-rowdel]");if(rdl){S.rows=S.rows.filter(x=>x.k!==rdl.dataset.rowdel);syncCats();save();closeMd();render();pushRows();return}
  if(e.target.closest("#md"))return;
  const ad=e.target.closest("[data-add]");if(ad){openAdd(ad.dataset.add);return}
  const ed=e.target.closest("[data-edit]");if(ed){openAdd(null,ed.dataset.edit);return}
  const ak=e.target.closest("[data-ask]");if(ak){copy(askText(byId(ak.dataset.ask)));toast("Prompt copied",false);return}
  if(e.target.closest("[data-addrow]")){openRow(null);return}
  const fo=e.target.closest("[data-focus]");if(fo){openFocus(fo.dataset.focus);return}
  if(e.target.closest("[data-unfocus]")){closeFocus();return}
  const rw=e.target.closest("[data-row]");if(rw){openRow(rw.dataset.row);return}
  const zm=e.target.closest("[data-zoom]");if(zm){S.cw=Math.max(80,Math.min(200,S.cw+(+zm.dataset.zoom)*24));document.documentElement.style.setProperty("--cw",S.cw+"px");save();renderBoard();return}
  const st=e.target.closest("[data-step]");if(st){step(+st.dataset.step);return}
  if(e.target.closest("[data-close]")){closeRef();return}
  const cp=e.target.closest("[data-copy]");if(cp){copy(shotText(byId(cp.dataset.copy)));toast("Shot list copied",false);return}
  const op=e.target.closest("[data-open]");if(op){openRef(op.dataset.open)}
});
document.addEventListener("keydown",e=>{if(MD.classList.contains("open")){if(e.key==="Escape"){if(passWait)passDone("");else closeMd()}if(e.key==="Enter"&&e.target.tagName==="INPUT"){const b=MC.querySelector("[data-saveadd],[data-rowsave],[data-passok]");if(b)b.click()}return}if(e.key==="Escape"){const pop=document.getElementById("dpop");if(pop.classList.contains("open")){pop.classList.remove("open");document.getElementById("dumpBtn").classList.remove("on");return}if(cur){closeRef();return}if(fk){closeFocus();return}return}if(!cur)return;if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
document.getElementById("q").addEventListener("input",e=>{F.q=e.target.value.trim().toLowerCase();render()});
document.documentElement.style.setProperty("--cw",S.cw+"px");
render();lastSig=sig();sync(true);
}
